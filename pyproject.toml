[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "valudus"
version = "0.1.0"
description = "Reproducible evaluation tooling for intelligence benchmarks"
requires-python = ">=3.11"
license = {file = "LICENSE"}

[project.scripts]
valudus = "valudus.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
